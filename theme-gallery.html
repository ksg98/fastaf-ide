<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TUICommander — theme gallery</title>
    <script>
      // Fake Tauri runtime, installed BEFORE any module loads: the SDK reads
      // window.__TAURI_INTERNALS__ at import time. Unlike index.html this does
      // NOT set __TAURI_SHIM__, so isTauri() is true and the real components
      // take their desktop branches (IdeLauncher, tauri listen, ...). Every
      // invoke lands in the answer table src/dev/themeGallery.tsx installs as
      // window.__GALLERY_INVOKE__; nothing touches the network.
      window.__TAURI_INTERNALS__ = {
        transformCallback: function () { return 0; },
        invoke: function (cmd, args) {
          var handler = window.__GALLERY_INVOKE__;
          return handler ? handler(cmd, args) : Promise.resolve(null);
        },
        convertFileSrc: function (path) { return path; },
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
      };
    </script>
    <script type="module" src="/src/dev/themeGallery.tsx"></script>
  </head>
  <body>
    <div id="gallery"></div>
  </body>
</html>
