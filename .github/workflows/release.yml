name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# sccache's 600s idle timer counts time without *new* requests, so the final
# single-codegen-unit compile of the tuicommander lib — well over ten minutes on
# the Windows runner — outlives it: the server exits and the in-flight rustc dies
# with "connection forcibly closed" (os error 10054). 0 keeps the server alive for
# the whole job. It sits at workflow level because sccache-action starts the
# server, so a step-level value would never reach it.
#
# RUST_VERSION pins the compiler so a new stable cannot change what ships. Bump it
# in lockstep with ci.yml, nightly.yml, remote-daemon.yml and audit.yml — see the note in ci.yml and
# docs/guides/ci.md.
env:
  SCCACHE_IDLE_TIMEOUT: "0"
  RUST_VERSION: "1.99.1"

jobs:
  build:
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS-ARM
          # 24.04, not 22.04, because ONNX Runtime's prebuilt (pulled in by
          # `ort` for the voice agent) needs glibc 2.38+ and libstdc++ 13+ —
          # 22.04 ships 2.35/12 and the link fails on __isoc23_strtoll and
          # basic_string::_M_replace_cold. This raises the glibc floor of the
          # published .deb/.AppImage to 2.39, so Ubuntu 22.04 and Debian 12 are
          # no longer supported targets for the desktop app. The remote-daemon
          # jobs below stay on 22.04: they build without the `desktop` feature,
          # so they never link ort and keep the wider compatibility.
          - platform: ubuntu-24.04
            args: ''
            label: Linux-x64
          - platform: windows-latest
            args: '--bundles nsis'
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A no-op for FastAF, which has no `plugins` submodule. Left on so a
          # future submodule is checked out.
          submodules: recursive

      # shell: bash — the Windows leg defaults to pwsh, where "$GITHUB_REF_NAME"
      # and "$GITHUB_OUTPUT" are unset PowerShell variables.
      - name: Check tag matches version
        if: github.ref_type == 'tag'
        shell: bash
        run: bash scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      # A prerelease version (2.0.0-beta.1) must never become "latest": the stable
      # updater endpoint and install scripts read releases/latest.
      - name: Release flags
        id: flags
        shell: bash
        run: bash scripts/release-flags.sh "$(jq -r '.version' src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # libayatana-appindicator3-dev, not libappindicator3-dev: the latter
          # was dropped in Ubuntu 24.04.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev mold

      # Keep the Windows build/target dir short (C:/t): whisper.cpp's nested
      # CMake TryCompile paths can exceed the 260-char MAX_PATH that MSBuild's
      # FileTracker enforces. tauri-action honours CARGO_TARGET_DIR for artifact
      # discovery (see tauri-action/src/utils.ts).
      - name: Short CARGO_TARGET_DIR (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "CARGO_TARGET_DIR=C:/t" >> $GITHUB_ENV

      # The windows-latest image (mid windows-2025/2026 migration) ships VS 18
      # 2026, but the preinstalled CMake is too old to know that generator —
      # whisper-rs-sys's build fails with "CMake Error: generator: Visual
      # Studio 18 2026". Install the latest CMake, which recognises it.
      - name: Upgrade CMake (Windows)
        if: matrix.platform == 'windows-latest'
        uses: lukka/get-cmake@f86dd60acae0d132056913e248bdabf0e0580b7a # v4.4.5

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # webrtc-audio-processing builds the bundled APM (dictation echo
      # cancellation) with meson and ninja, which no runner image ships. pip
      # rather than apt/brew/choco so every leg gets the same version: Ubuntu
      # 22.04 packages meson 0.61, which is older than the abseil wrap expects.
      # The build also fetches abseil-cpp from github.com while it runs.
      - name: Install meson and ninja
        shell: bash
        run: python -m pip install meson==1.11.2 ninja==1.13.2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'
          cache-directories: ${{ matrix.platform == 'windows-latest' && 'C:/t' || '' }}

      # A restored Windows build cache (C:/t) may hold a CMakeCache.txt from an
      # older VS generator (e.g. VS 17 2022). When the runner image moves to a
      # newer VS (18 2026), CMake aborts: "generator does not match the generator
      # used previously". Drop the stale CMake config so whisper-rs-sys
      # reconfigures against the current toolchain (sccache still caches the
      # actual compiles, so the rebuild cost is minimal).
      - name: Clear stale CMake cache (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path C:/t) {
            Get-ChildItem -Path C:/t -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq 'CMakeCache.txt' -or $_.Name -eq 'CMakeFiles' } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # A release must be signed AND notarized. An unsigned build would reach
      # every user through the updater and replace the notarized app, and macOS
      # ties granted permissions (microphone, accessibility, files) to the code
      # identity, so they would all be lost. `require: 'true'` turns a missing,
      # invalid or expired secret into a failed job instead of an unsigned
      # bundle. The action exports MACOS_SIGNING / MACOS_NOTARIZING and, only
      # when they carry a value, the APPLE_* env that tauri-action reads.
      # nightly.yml stays best effort.
      - name: Configure macOS signing
        if: startsWith(matrix.platform, 'macos-')
        uses: ./.github/actions/macos-signing
        with:
          require: 'true'
          cert-base64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          cert-password: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          notarize-key-base64: ${{ secrets.NOTARIZE_KEY_BASE64 }}
          notarize-key-id: ${{ secrets.NOTARIZE_KEY_ID }}
          notarize-issuer-id: ${{ secrets.NOTARIZE_ISSUER_ID }}

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # sccache
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          # mold linker on Linux
          RUSTFLAGS: ${{ matrix.label == 'Linux-x64' && '-C link-arg=-fuse-ld=mold' || '' }}
          # macOS signing/notarization env (APPLE_SIGNING_IDENTITY, KEYCHAIN_PATH,
          # APPLE_API_*) is exported via
          # GITHUB_ENV by the macos-signing action ONLY when signing is available. The tauri bundler treats even
          # an empty APPLE_* variable as "signing requested", so the variables
          # must be entirely absent for an unsigned build — never set them here.
          # Updater artifact signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # whisper.cpp build flags per platform:
          # - macOS: override -march to avoid i8mm detection mismatch on M-series < M4 (Metal GPU always active)
          # - Linux: -fPIC required for whisper-rs-sys static linking
          # - Windows: whisper-rs is CPU-only (Vulkan backend's shader build is broken on the runner); -Z7 for sccache MSVC compat
          CMAKE_C_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Linux-x64' && '-fPIC' || matrix.label == 'Windows-x64' && '-Z7' || '' }}
          CMAKE_CXX_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Linux-x64' && '-fPIC' || matrix.label == 'Windows-x64' && '-Z7' || '' }}
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: 'FastAF v__VERSION__'
          releaseBody: 'Download the appropriate installer for your platform.'
          releaseDraft: true
          prerelease: ${{ steps.flags.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          # tauri.conf.json enables the non-default dictation feature for bundles.
          args: ${{ matrix.args }}

      # The bundler signs, notarizes and staples inside tauri-action. Check the
      # result rather than trusting the env: the .app that went into the DMG and
      # the updater tarball must carry a Developer ID signature and a stapled
      # notarization ticket.
      - name: Verify macOS signature and notarization
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          shopt -s nullglob
          apps=(src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::No .app bundle found to verify"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            # Captured first: `grep -q` exiting early would SIGPIPE codesign, and
            # under pipefail that reads as "not signed".
            details=$(codesign -dv --verbose=4 "$app" 2>&1)
            if ! grep -q '^Authority=Developer ID Application:' <<<"$details"; then
              echo "::error::$app is not signed with a Developer ID Application certificate"
              exit 1
            fi
            xcrun stapler validate "$app"
          done

      # finalize-release words the macOS install note from this: a signed and
      # notarized DMG opens normally, an unsigned one needs the quarantine
      # workaround.
      - name: Record macOS signing state
        if: startsWith(matrix.platform, 'macos-')
        run: echo "signing=${MACOS_SIGNING} notarizing=${MACOS_NOTARIZING}" > macos-signing-state

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(matrix.platform, 'macos-')
        with:
          name: macos-signing-state
          path: macos-signing-state

      - name: Cleanup macOS keychain
        if: always() && startsWith(matrix.platform, 'macos-')
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$APPLE_API_KEY_PATH" 2>/dev/null || true

  remote-daemon:
    # tauri-action creates the draft at the end of the desktop build. Fast daemon
    # builds must not upload by tag before that release exists.
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/remote-daemon.yml

  finalize-release:
    timeout-minutes: 15
    needs: [build, remote-daemon]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches version
        if: github.ref_type == 'tag'
        run: bash scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: macos-signing-state

      # The README's download button links to
      # releases/latest/download/FastAF_aarch64.dmg, which needs a file of that
      # exact name in every release. The bundler puts the version in the DMG's
      # name, so upload a version-less copy beside it. A missing macOS build only
      # warns: it must not hold back the rest of the release.
      - name: Add the version-less macOS DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"
          mkdir -p /tmp/dmg
          if gh release download "${TAG}" --pattern "FastAF_${VERSION}_aarch64.dmg" --dir /tmp/dmg; then
            cp "/tmp/dmg/FastAF_${VERSION}_aarch64.dmg" /tmp/dmg/FastAF_aarch64.dmg
            gh release upload "${TAG}" /tmp/dmg/FastAF_aarch64.dmg --clobber
          else
            echo "::warning::FastAF_${VERSION}_aarch64.dmg is not in ${TAG}; the README download button will 404 until FastAF_aarch64.dmg is uploaded"
          fi

      - name: Build release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="v${VERSION}"

          # Extract changelog section for this version
          mkdir -p .tmp/tuic-tests
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md > .tmp/tuic-tests/changelog-section.md

          # Build release body: changelog + download legend
          {
            echo "## What's Changed"
            echo ""
            if [ -s .tmp/tuic-tests/changelog-section.md ]; then
              cat .tmp/tuic-tests/changelog-section.md
            else
              echo "See [CHANGELOG.md](https://github.com/ksg98/fastaf-ide/blob/main/CHANGELOG.md) for details."
            fi
            echo ""
            # Download legend (quoted heredoc — no variable expansion)
            cat <<'LEGEND'
          ---

          📦 **Downloads**

          Pick the right build for your system:
          LEGEND
            # Version-specific filenames (unquoted heredoc for variable expansion)
            cat <<FILENAMES

          * 🍎 **macOS** (Apple Silicon)
              \`FastAF_${VERSION}_aarch64.dmg\`
              (same file: \`FastAF_aarch64.dmg\`; alt: \`FastAF_aarch64.app.tar.gz\`)
          * 🪟 **Windows** (64-bit)
              \`FastAF_${VERSION}_x64-setup.exe\`
          * 🐧 **Linux** (Debian / Ubuntu)
              \`FastAF_${VERSION}_amd64.deb\`
          * 🐧 **Linux** (RHEL / Fedora / CentOS)
              \`FastAF-${VERSION}-1.x86_64.rpm\`
          * 🐧 **Linux** (portable)
              \`FastAF_${VERSION}_amd64.AppImage\`
          FILENAMES
            cat <<'FOOTER'

          ---

          🔐 **Verify** (optional)

          Each release includes `.sig` files for signature verification.

          ---

          FOOTER
            # The macOS build job records whether it signed and notarized.
            if grep -q "signing=true notarizing=true" macos-signing-state 2>/dev/null; then
              cat <<'INSTALL'
          💻 **Install**

          The macOS build is signed with a Developer ID and notarized by Apple — open the DMG and drag FastAF.app to /Applications.
          INSTALL
            else
              cat <<'INSTALL'
          💻 **Install** (unsigned build)

          macOS quarantines unsigned apps — after copying FastAF.app to /Applications, run before first launch:

          ```bash
          xattr -cr /Applications/FastAF.app
          ```
          INSTALL
            fi
          } > .tmp/tuic-tests/release-body.md

          # GitHub rejects bodies over 125000 characters. A byte budget is stricter
          # for UTF-8; reserve the complete download footer and full-changelog link.
          python3 - "${TAG}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(".tmp/tuic-tests/release-body.md")
          body = path.read_bytes()
          if len(body) > 120000:
              notes, separator, footer = body.rpartition("\n---\n\n📦 **Downloads**".encode("utf-8"))
              assert separator, "Release download footer not found"
              footer = separator + footer
              link = (f"\n\n[Full changelog](https://github.com/ksg98/fastaf-ide/blob/{sys.argv[1]}/CHANGELOG.md)"
                      " — release notes truncated.\n").encode("utf-8")
              budget = 120000 - len(footer) - len(link)
              # Keep only complete lines, including for an oversized single line.
              prefix = notes[:budget]
              prefix = prefix[:prefix.rfind(b"\n") + 1]
              path.write_bytes(prefix + link + footer)
          PY

          # A stable release leaves "latest" to GitHub, as before; a prerelease never takes it.
          eval "$(bash scripts/release-flags.sh "${VERSION}")"
          latest_flag=()
          [[ "${latest}" == false ]] && latest_flag=(--latest=false)
          gh release edit "${TAG}" --notes-file .tmp/tuic-tests/release-body.md --draft=false \
            --prerelease="${prerelease}" "${latest_flag[@]}"
