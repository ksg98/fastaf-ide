name: Dependency Audit

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write

# RUST_VERSION pins the compiler; bump it in lockstep with ci.yml, release.yml,
# remote-daemon.yml and nightly.yml — see the note in ci.yml and docs/guides/ci.md.
env:
  RUST_VERSION: "1.99.1"

jobs:
  audit:
    timeout-minutes: 15
    name: Security audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No `cache: pnpm`: this job never runs `pnpm install`, so the store path
          # does not exist and the post step failed the whole run on 2026-10-12.

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      - name: pnpm audit
        id: pnpm_audit
        continue-on-error: true
        run: |
          set +e
          OUTPUT=$(pnpm audit --audit-level=high 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Save output for issue body (truncate if huge)
          mkdir -p .tmp/tuic-tests
          echo "$OUTPUT" | head -100 > .tmp/tuic-tests/pnpm-audit.txt

      # Accepted advisories are ignored through src-tauri/.cargo/audit.toml, which
      # cargo-audit picks up from the working directory. `make check` runs the same
      # bare command, so local and CI runs share one reasoned ignore list.
      - name: cargo audit
        id: cargo_audit
        continue-on-error: true
        working-directory: src-tauri
        run: |
          set +e
          OUTPUT=$(cargo audit 2>&1)
          EXIT_CODE=$?
          echo "$OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          mkdir -p ../.tmp/tuic-tests
          echo "$OUTPUT" | head -100 > ../.tmp/tuic-tests/cargo-audit.txt

      - name: Create issue if vulnerabilities found
        if: steps.pnpm_audit.outputs.exit_code != '0' || steps.cargo_audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="## Dependency Audit — $(date -u +%Y-%m-%d)"
          BODY="$BODY"$'\n\n'"Automated weekly audit found vulnerabilities."

          if [ "${{ steps.pnpm_audit.outputs.exit_code }}" != "0" ]; then
            BODY="$BODY"$'\n\n'"### pnpm audit"$'\n\n'"<details><summary>Output</summary>"$'\n\n'"\`\`\`"$'\n'"$(cat .tmp/tuic-tests/pnpm-audit.txt)"$'\n'"\`\`\`"$'\n'"</details>"
          fi

          if [ "${{ steps.cargo_audit.outputs.exit_code }}" != "0" ]; then
            BODY="$BODY"$'\n\n'"### cargo audit"$'\n\n'"<details><summary>Output</summary>"$'\n\n'"\`\`\`"$'\n'"$(cat .tmp/tuic-tests/cargo-audit.txt)"$'\n'"\`\`\`"$'\n'"</details>"
          fi

          # Check if an open audit issue already exists to avoid duplicates
          EXISTING=$(gh issue list --label "security" --state open --search "Dependency Audit" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "Dependency Audit: vulnerabilities found ($(date -u +%Y-%m-%d))" \
              --body "$BODY" \
              --label "security,P1: high"
          fi
