name: macOS signing
description: >
  Import the Developer ID certificate into a throwaway keychain and export the
  signing + notarization env that the tauri bundler reads.

  With `require: true` (release builds) any missing or invalid secret fails the
  job. A release must never ship an unsigned or un-notarized macOS build: the
  updater would install it over the notarized app, and macOS would drop every
  permission the user granted, because the code identity changed.

  With `require: false` (nightly) it is best effort: a missing or invalid secret
  leaves every APPLE_* variable unset, so the build falls through to an
  unsigned bundle, and the job's run summary says so in a warning block.

  Exports via GITHUB_ENV:
    MACOS_SIGNING     true when a Developer ID identity was imported
    MACOS_NOTARIZING  true when notarization credentials were exported too
    APPLE_SIGNING_IDENTITY, KEYCHAIN_PATH                     (signing)
    APPLE_API_KEY_PATH, APPLE_API_ISSUER, APPLE_API_KEY       (notarization)

  Notarization uses an App Store Connect Team API key, never an Apple ID: the
  key is not tied to a personal login or 2FA, survives a password change, and
  is revocable on its own.

  The tauri bundler treats even an EMPTY APPLE_* variable as "signing
  requested", so callers must not set those variables on tauri-action
  themselves — they are exported here only when they carry a value.

inputs:
  require:
    description: >
      'true' fails the job unless signing AND notarization are both configured.
      'false' falls through to an unsigned or un-notarized bundle and says so
      in the run summary.
    required: false
    default: 'false'
  cert-base64:
    description: Base64 of the Developer ID Application .p12
    required: false
  cert-password:
    description: Password of the .p12
    required: false
  notarize-key-base64:
    description: Base64 of an App Store Connect Team API key (.p8)
    required: false
  notarize-key-id:
    description: App Store Connect API key id
    required: false
  notarize-issuer-id:
    description: App Store Connect API issuer id
    required: false

runs:
  using: composite
  steps:
    - name: Import Developer ID certificate
      shell: bash
      env:
        REQUIRE: ${{ inputs.require }}
        CERT_BASE64: ${{ inputs.cert-base64 }}
        CERT_PASSWORD: ${{ inputs.cert-password }}
      run: |
        echo "MACOS_SIGNING=false" >> "$GITHUB_ENV"
        echo "MACOS_NOTARIZING=false" >> "$GITHUB_ENV"

        # Required: fail the job. Best effort: warn, and put it in the run
        # summary, where a skimmed green run still shows it.
        unsigned() {
          if [ "$REQUIRE" = "true" ]; then
            echo "::error::$1 — a release build must be signed and notarized"
            exit 1
          fi
          echo "::warning::$1 — building an UNSIGNED macOS bundle"
          {
            echo "> [!WARNING]"
            echo "> **This macOS build is UNSIGNED.** $1."
            echo "> Gatekeeper will block it, and installing it over a signed FastAF resets the user's macOS permissions."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        }

        if [ -z "$CERT_BASE64" ]; then
          unsigned "DEVELOPER_ID_CERT_BASE64 secret not set"
        fi

        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        CERT_PATH=$RUNNER_TEMP/cert.p12
        echo "$CERT_BASE64" | base64 --decode > "$CERT_PATH"
        if ! security import "$CERT_PATH" \
          -k "$KEYCHAIN_PATH" \
          -P "$CERT_PASSWORD" \
          -T /usr/bin/codesign; then
          rm -f "$CERT_PATH"
          security delete-keychain "$KEYCHAIN_PATH" || true
          unsigned "Certificate import failed (invalid p12 or wrong password)"
        fi
        rm -f "$CERT_PATH"

        # A fresh runner may lack Apple's Developer ID G2 intermediate. Without
        # it `find-identity -v` calls the identity invalid, so import it next to
        # the certificate.
        G2_PATH=$RUNNER_TEMP/DeveloperIDG2CA.cer
        if curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$G2_PATH"; then
          security import "$G2_PATH" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          rm -f "$G2_PATH"
        else
          echo "::warning::Could not download the Developer ID G2 intermediate"
        fi

        security set-key-partition-list -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application:" | head -1 | sed 's/.*"\(.*\)".*/\1/' || true)
        if [ -z "$IDENTITY" ]; then
          security delete-keychain "$KEYCHAIN_PATH" || true
          unsigned "No valid Developer ID Application identity in the imported certificate (expired or revoked?)"
        fi
        echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
        echo "MACOS_SIGNING=true" >> "$GITHUB_ENV"

    - name: Configure notarization
      if: env.MACOS_SIGNING == 'true'
      shell: bash
      env:
        REQUIRE: ${{ inputs.require }}
        NOTARIZE_KEY_BASE64: ${{ inputs.notarize-key-base64 }}
        NOTARIZE_KEY_ID: ${{ inputs.notarize-key-id }}
        NOTARIZE_ISSUER_ID: ${{ inputs.notarize-issuer-id }}
      run: |
        if [ -z "$NOTARIZE_KEY_BASE64" ] || [ -z "$NOTARIZE_KEY_ID" ] || [ -z "$NOTARIZE_ISSUER_ID" ]; then
          MESSAGE="NOTARIZE_KEY_BASE64 / NOTARIZE_KEY_ID / NOTARIZE_ISSUER_ID not set"
          if [ "$REQUIRE" = "true" ]; then
            echo "::error::$MESSAGE — a release build must be signed and notarized"
            exit 1
          fi
          echo "::warning::$MESSAGE — signed but NOT notarized"
          {
            echo "> [!WARNING]"
            echo "> **This macOS build is signed but NOT notarized.** $MESSAGE."
            echo "> Gatekeeper will warn on first launch."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARIZE_KEY_ID}.p8"
        echo "$NOTARIZE_KEY_BASE64" | base64 --decode > "$KEY_PATH"
        echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
        echo "APPLE_API_ISSUER=$NOTARIZE_ISSUER_ID" >> "$GITHUB_ENV"
        echo "APPLE_API_KEY=$NOTARIZE_KEY_ID" >> "$GITHUB_ENV"
        echo "MACOS_NOTARIZING=true" >> "$GITHUB_ENV"
