<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown selection reference</title></head><body><div id="root"></div><script>window.addEventListener('error', e => { const p = document.createElement('pre'); p.id = 'reference-error'; p.textContent = e.message + '\n' + e.error?.stack; document.body.append(p); }); window.addEventListener('unhandledrejection', e => { const p = document.createElement('pre'); p.id = 'reference-error'; p.textContent = String(e.reason); document.body.append(p); });</script><script type="module" src="./markdownChatReference.jsx"></script></body></html>
