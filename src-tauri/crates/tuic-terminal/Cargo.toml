[package]
name = "tuic-terminal"
version.workspace = true
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
dirs = "7"
lazy_static = "1"
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tuic-ansi = { path = "../tuic-ansi" }
tuic-test-support = { path = "../tuic-test-support" }

[lints]
workspace = true
