[package]
name = "tuic-bridge"
version.workspace = true
description = "MCP stdio-to-IPC bridge sidecar for FastAF"
authors = ["FastAF <https://github.com/ksg98/fastaf-ide>"]
edition = "2024"

[[bin]]
name = "tuic-bridge"
path = "src/main.rs"

[dependencies]
tuic-ipc = { path = "../tuic-ipc" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
dirs = "7"

[dev-dependencies]
tempfile = "3"
tuic-test-support = { path = "../tuic-test-support" }

[lints]
workspace = true
