[package]
name = "fastaf-cli"
version.workspace = true
description = "CLI companion for FastAF — editor opener, session multiplexer, tmux replacement"
authors = ["Stefano Straus <github.com/sstraus>"]
edition = "2024"

# The bundled file is `fastaf-cli`: a sidecar named `fastaf` would overwrite the
# app's own `FastAF` executable on a case-insensitive filesystem (macOS, Windows).
# The installer copies it into PATH as plain `fastaf`.
[[bin]]
name = "fastaf-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
dirs = "6"

[lints]
workspace = true
