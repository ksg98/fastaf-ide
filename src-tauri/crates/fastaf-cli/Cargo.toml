[package]
name = "fastaf-cli"
version.workspace = true
description = "CLI companion for FastAF — editor opener, session multiplexer, tmux replacement"
authors = ["FastAF <https://github.com/ksg98/fastaf-ide>"]
edition = "2024"

# The bundled file is `fastaf-cli`: a sidecar named `fastaf` would overwrite the
# app's own `FastAF` executable on a case-insensitive filesystem (macOS, Windows).
# The installer copies it into PATH as plain `fastaf`.
[[bin]]
name = "fastaf-cli"
path = "src/main.rs"

[dependencies]
tuic-ipc = { path = "../tuic-ipc" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
dirs = "7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tuic-test-support = { path = "../tuic-test-support" }
tempfile = "3"

[lints]
workspace = true
