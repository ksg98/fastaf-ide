[env]
# Match bundle.macOS.minimumSystemVersion in tauri.conf.json (checked by
# scripts/test-macos-deployment-target.sh). Rust, cc and the WebRTC wrapper read
# MACOSX_DEPLOYMENT_TARGET; whisper.cpp forwards CMAKE_OSX_DEPLOYMENT_TARGET
# explicitly so existing CMake caches also update. Keep both values aligned
# with the bundle minimum through the check above.
# Override inherited pre-Monterey shell defaults as well as Cargo's own default.
MACOSX_DEPLOYMENT_TARGET = { value = "12.0", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = { value = "12.0", force = true }
# whisper.cpp auto-wraps CMake compilers with sccache. That wrapper cannot
# reliably compile through mbx's compiler shims; mbx still caches Cargo builds.
GGML_CCACHE = "OFF"

[term]
progress.term-integration = true
