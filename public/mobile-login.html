<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- No manifest or icon links: they are not public, and a 401 with a Basic challenge on a
         subresource raises the native sign-in dialog this page replaces. -->
    <title>FastAF Login</title>
    <style>
      html, body { margin: 0; padding: 0; background: #1e1e1e; color: #c9d1d9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; }
      body { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      form { width: 100%; max-width: 320px; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
      label { display: block; font-size: 13px; color: #8b949e; margin: 12px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px; color: #c9d1d9;
        background: #0d1117; border: 1px solid #30363d; border-radius: 6px; }
      button { width: 100%; margin-top: 20px; padding: 10px 12px; font-size: 16px; color: #c9d1d9;
        background: #21262d; border: 1px solid #30363d; border-radius: 6px; }
      button:disabled { opacity: 0.5; }
      #error { min-height: 1.4em; margin: 12px 0 0; font-size: 14px; color: #f85149; }
    </style>
  </head>
  <body>
    <form id="login" method="post" action="/auth/login">
      <h1>FastAF</h1>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <p id="error" role="alert"></p>
      <button id="submit" type="submit">Log in</button>
    </form>
    <script src="/mobile-login.js"></script>
  </body>
</html>
